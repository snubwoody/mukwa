[package]
name = "mukwa"
version.workspace = true
edition.workspace = true

[dependencies]
mukwa-core = {path = "../core"}
jiff.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tiny-skia.workspace = true
serde.workspace = true
toml.workspace = true
uuid.workspace = true
rusqlite.workspace = true
fontdb.workspace = true
tempfile.workspace = true

# Skia can't be built in flatpak because the binaries cannot be downloaded
[target.'cfg(target_os = "linux")'.dependencies.slint]
git = "https://github.com/snubwoody/slint.git"
branch = "mukwa"
version = "1.17.0"
features = ["backend-winit", "renderer-femtovg", "log"]

[target.'cfg(not(target_os = "linux"))'.dependencies.slint]
git = "https://github.com/snubwoody/slint.git"
branch = "mukwa"
version = "1.17.0"
features = ["backend-winit", "renderer-skia", "log"]

[dev-dependencies.i-slint-backend-testing]
git = "https://github.com/snubwoody/slint.git"
branch = "mukwa"
version = "1.17.0"

[build-dependencies]
slint-build = { version = "1.16.0", git = "https://github.com/snubwoody/slint.git", branch = "mukwa" }
winresource = "0.1.31"
lucide-slint = "1.24.0"
