id: com.wakunguma.Mukwa
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mukwa
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.a11y.Bus
build-options:
  append-path: "/usr/lib/sdk/rust-stable/bin"
modules:
  - name: mukwa
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/mukwa/cargo
    build-commands:
      - cargo fetch --offline --target x86_64-unknown-linux-gnu
      - cargo build --offline --target x86_64-unknown-linux-gnu -r -p mukwa
      - install -Dm755 target/x86_64-unknown-linux-gnu/release/mukwa /app/bin/mukwa
      - install -Dm644 crates/mukwa/resources/icons/app-icon.svg /app/share/icons/hicolor/scalable/apps/com.wakunguma.Mukwa.svg
      - install -Dm644 crates/mukwa/resources/mukwa.desktop /app/share/applications/com.wakunguma.Mukwa.desktop
      - install -Dm644 crates/mukwa/resources/mukwa.metainfo.xml /app/share/metainfo/com.wakunguma.Mukwa.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/snubwoody/mukwa/archive/refs/tags/v0.1.0.tar.gz
        sha256: fecebae5cb7c9dd0df3abbed14aa1df8a07bcf4e40539dab27182c27cf205ed6
      - type: git
        url: https://github.com/snubwoody/slint
        commit: 4b77493c07668f1c1f9efa9aadb45adda7be850e
        dest: "slint"
      - type: inline
        contents: |
          [patch."https://github.com/snubwoody/slint"]
          slint = { path = "/run/build/mukwa/slint/api/rs/slint" }
        dest: ".cargo"
        dest-filename: "config.toml"
