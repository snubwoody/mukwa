id: com.wakunguma.Mukwa
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mukwa
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.a11y.Bus
build-options:
  append-path: "/usr/lib/sdk/rust-stable/bin"
modules:
  - name: mukwa
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/mukwa/cargo
        CARGO_NET_OFFLINE: 'true'
        SKIA_BINARIES_URL: file:///run/build/mukwa/skia-binaries.tar.gz
    build-commands:
      #- cargo fetch --offline --verbose
      - cargo build --offline -r -p mukwa
      - install -Dm755 target/release/mukwa /app/bin/mukwa
      - install -Dm644 crates/mukwa/resources/icons/app-icon.svg /app/share/icons/hicolor/scalable/apps/com.wakunguma.Mukwa.svg
      - install -Dm644 crates/mukwa/resources/mukwa.desktop /app/share/applications/com.wakunguma.Mukwa.desktop
      - install -Dm644 crates/mukwa/resources/mukwa.metainfo.xml /app/share/metainfo/com.wakunguma.Mukwa.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/snubwoody/mukwa/archive/refs/tags/v0.1.0.tar.gz
        sha256: fecebae5cb7c9dd0df3abbed14aa1df8a07bcf4e40539dab27182c27cf205ed6
      - type: archive
        url: https://github.com/rust-skia/skia-binaries/releases/download/0.99.0/skia-binaries-a25a0fdb7d90429aa2d1-x86_64-unknown-linux-gnu-gl-jpegd-jpege-pdf-textlayout-vulkan.tar.gz
        dest-filename: skia-binaries.tar.gz
        sha256: 097e78d775c9156dc4b070b9cca7008dbab587513ecb1924baf4cf9620f3119b
      - cargo-sources.json
