[package]
name = "mukwa"
version = "0.1.0-alpha.1"
edition = "2024"
default-run = "mukwa"

[[bench]]
name = "service"
harness = false

[[bin]]
name = "mukwa"
path = "src/bin/main.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[dependencies]
slint = { version = "1.17.0", features = ["backend-winit", "renderer-skia"] }
tracing = "0.1.44"
tempfile = "3.27.0"
jiff = "0.2.29"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v7"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
tracing-appender = "0.2.5"
rust-embed = "8.12.0"

[build-dependencies]
slint-build = "1.16.0"
lucide-slint = "1.24.0"

[dev-dependencies]
divan = "0.1.21"
