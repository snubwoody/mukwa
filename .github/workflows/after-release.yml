name: After Release
on:
  release:
    types: [released]
jobs:
  publish:
    name: Publish to Winget
    runs-on: ubuntu-slim
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Wakunguma.Mukwa
          installers-regex: '\-x86_64-Setup.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
