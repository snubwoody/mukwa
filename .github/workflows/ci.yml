name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
env:
  CARGO_TERM_COLOR: always
concurrency:
  cancel-in-progress: true
  group: ${{github.ref}}-${{github.job}}
jobs:
  measure-compile-times:
    strategy:
      fail-fast: false
      matrix:
        rust-flags:
          - "-Zshare-generics=y"
          - "-Clinker=rust-lld.exe -Clink-arg=/FORCE:MULTIPLE"
          - ""
    runs-on: windows-latest
    env:
      RUSTFLAGS: ${{matrix.rust-flags}}
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-nu@v3
        with:
          version: 0.114.1
      - name: Install nightly toolchain
        run: rustup toolchain install nightly
      - run: cargo +nightly build -p mukwa
      - run: cargo +nightly clean -p mukwa
      - run: cargo +nightly build -p mukwa
  format:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --check
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: ${{runner.os == 'Linux'}}
        run: |
          sudo apt update
          sudo apt install libx11-xcb-dev \
          xinput \
          libxcursor-dev \
          libxkbcommon-x11-dev \
          libfontconfig1-dev \
          pkg-config \
          libx11-dev
      - run: cargo clippy --all-targets -- -Dwarnings
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install system dependencies
        if: ${{runner.os == 'Linux'}}
        run: |
          sudo apt update
          sudo apt install libx11-xcb-dev \
          xinput \
          libxcursor-dev \
          libxkbcommon-x11-dev \
          libfontconfig1-dev \
          pkg-config \
          libx11-dev
      - run: cargo nextest run --locked --no-fail-fast
  doc-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: ${{runner.os == 'Linux'}}
        run: |
          sudo apt update
          sudo apt install libx11-xcb-dev \
          xinput \
          libxcursor-dev \
          libxkbcommon-x11-dev \
          libfontconfig1-dev \
          pkg-config \
          libx11-dev
      - run: cargo test --doc
