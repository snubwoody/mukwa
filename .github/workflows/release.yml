name: Release
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
concurrency:
  cancel-in-progress: true
  group: release-mukwa
env:
  CARGO_TERM_COLOR: always
jobs:
  bundle-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with: # TODO: hash by architecture
          key: ${{runner.os}}-Rust-${{hashFiles('**/Cargo.toml')}}-${{hashFiles('**/Cargo.lock')}}
          restore-keys: |
            ${{runner.os}}-Rust-${{hashFiles('Cargo.toml')}}-
            ${{runner.os}}-Rust-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: hustcer/setup-nu@v3
        with:
          version: 0.114.1
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libx11-xcb-dev \
          xinput \
          libxcursor-dev \
          libxkbcommon-x11-dev \
          libfontconfig1-dev \
          pkg-config \
          libx11-dev
      - name: Bundle app
        run: nu scripts/bundle-appimage.nu
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          key: ${{runner.os}}-Rust-${{hashFiles('**/Cargo.toml')}}-${{hashFiles('**/Cargo.lock')}}
          restore-keys: |
            ${{runner.os}}-Rust-${{hashFiles('Cargo.toml')}}-
            ${{runner.os}}-Rust-
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - name: Bundle app
        run: scripts/bundle-windows.ps1
